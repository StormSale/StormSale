# nginx.conf (Production snippet)
server {
    listen 80;
    server_name stormsale.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stormsale.io;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; connect-src 'self' https://soroban-testnet.stellar.org https://soroban-rpc.mainnet.stellar.org https://horizon-testnet.stellar.org https://horizon.stellar.org https://friendbot.stellar.org https://albedo.link https://stellar.expert https://mainnet.stellar.blockdaemon.com https://testnet.stellar.blockdaemon.com https://horizon.blockdaemon.com https://horizon.testnet.stellar.blockdaemon.com https://stellar.publicnode.com https://stellar-testnet.publicnode.com https://rpc.blockdag.network https://public.chainalysis.com https://api.coingecko.com https://hermes.pyth.network; img-src 'self' data: blob: https://images.unsplash.com https://i.pravatar.cc https://stellar.expert https://albedo.link https://xbull.app; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self' https://albedo.link;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
