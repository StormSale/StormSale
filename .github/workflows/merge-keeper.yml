name: StormSale Merge Keeper

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "dev" ]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Specific PR number to evaluate (leave blank to sweep all open PRs)'
        required: false
        type: string
      dry_run:
        description: 'Dry run mode (evaluate and report status without performing merge)'
        required: false
        type: boolean
        default: false
  schedule:
    # Sweep open PRs targeting dev every 15 minutes
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: read
  checks: read

jobs:
  merge-keeper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Merge Keeper Audit & Merge Engine
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const { run } = require(path.resolve('.github/scripts/merge-keeper.cjs'));

            const specificPr = context.payload.inputs?.pr_number || 
              (context.payload.pull_request?.number ? String(context.payload.pull_request.number) : null);
            const dryRun = context.payload.inputs?.dry_run === 'true' || context.payload.inputs?.dry_run === true;

            await run({
              github,
              context,
              core,
              specificPrNumber: specificPr,
              dryRun
            });
