name: PR Preview Deployments

# Issue #214 — Automated PR Preview Deployments with Ephemeral Staging Environments.
#
# Every pull request builds the app and spins up a unique, disposable Vercel
# staging URL pointed at the Stellar **Testnet** so reviewers can click through
# UI changes in a live browser before merging. When the PR is closed or merged
# the preview deployment is torn down automatically.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build + deploy an ephemeral preview environment for open PRs.
  # Skipped on external forks where repository secrets are inaccessible.
  # ---------------------------------------------------------------------------
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview/pr-${{ github.event.pull_request.number }}
      url: ${{ steps.deploy.outputs.preview-url }}

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          # Build the contributor's HEAD so secrets can never leak into forks'
          # code paths beyond this trusted deployment step.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Preview Bundle (Stellar Testnet)
        # Preview environments always target the Stellar Testnet by default so
        # no mainnet contract or funds are ever touched from a staging URL.
        env:
          VITE_STELLAR_NETWORK: TESTNET
          VITE_STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          VITE_STELLAR_RPC_URL: "https://soroban-testnet.stellar.org"
          VITE_STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"
        run: npm run build

      - name: Deploy ephemeral Vercel preview
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Scope one immutable deployment per PR number for clean teardown.
          alias-domains: |
            pr-${{ github.event.pull_request.number }}.preview.stormsale.dev
          working-directory: ./
          vercel-args: "--confirm"

      - name: Comment live preview URL on the pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            if (!url) {
              core.warning("No preview URL produced by the deploy step.");
              return;
            }
            const prNumber = context.payload.pull_request.number;
            const marker = "<!-- stormsale-preview-comment -->";
            const commit = context.payload.pull_request.head.sha.slice(0, 7);
            // Build the comment line by line so the YAML block stays indented
            // while the rendered markdown starts at column 0 (no code block).
            const body = [
              marker,
              "### 🌐 Ephemeral preview environment is live",
              "",
              "| | |",
              "| :--- | :--- |",
              `| **Preview URL** | ${url} |`,
              "| **Network** | Stellar **Testnet** (default) |",
              `| **Commit** | \`${commit}\` |`,
              "",
              "> This staging environment is torn down automatically when the PR is closed or",
              "> merged. Click the URL to inspect UI changes in a live browser before approving.",
              "",
            ].join("\n");

            // Replace our previous preview comment instead of spamming the thread.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.body && c.body.includes("stormsale-preview-comment"),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # ---------------------------------------------------------------------------
  # Teardown the ephemeral environment when the PR is closed or merged.
  # Skipped on external forks where preview environments were not deployed.
  # ---------------------------------------------------------------------------
  teardown:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Remove ephemeral preview deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Remove every deployment tagged for this PR so the staging URL
          # expires cleanly and no orphaned preview lingers.
          vercel rm "stormsale" \
            --skip-build \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" 2>/dev/null || true
          echo "Tore down preview deployment for PR #${PR_NUMBER}."

      - name: Note teardown on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `🧹 Ephemeral preview environment for PR #${prNumber} has been torn down.`,
            });
