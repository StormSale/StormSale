name: Frontend CI & Test Audit

on:
  push:
    branches: [ "main", "dev" ]
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [ "main", "dev" ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Dependencies
      run: npm install

    - name: Run Unit Tests with Audit Export
      run: |
        npx vitest run --reporter=default --reporter=json --outputFile=test-results.json
      continue-on-error: true

    - name: Publish Test Audit Summary
      uses: actions/github-script@v2
      with:
        script: |
          const fs = require('fs');
          let summary = "### 🧪 Unit Test Execution Audit\n\n";
          try {
            if (!fs.existsSync('test-results.json')) {
              core.setFailed("Test results file not found.");
              return;
            }
            const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
            const passed = results.numPassedTests || 0;
            const total = results.numTotalTests || 0;
            const failed = results.numFailedTests || 0;
            const suites = results.numTotalTestSuites || 0;

            summary += `| Metric | Count | Status |\n`;
            summary += `| :--- | :---: | :---: |\n`;
            summary += `| **Total Tests Carried Out** | **${total}** | ${failed === 0 ? '✅ All Passed' : '❌ Failures Detected'} |\n`;
            summary += `| **Passed Tests** | ${passed} | ✅ |\n`;
            summary += `| **Failed Tests** | ${failed} | ${failed > 0 ? '❌' : '0'} |\n`;
            summary += `| **Test Suites** | ${suites} | 📁 |\n\n`;

            if (results.testResults && results.testResults.length > 0) {
              summary += `#### 📋 Suite Breakdown\n`;
              summary += `| Test Suite | Tests Passed | Duration |\n`;
              summary += `| :--- | :---: | :---: |\n`;
              for (const suite of results.testResults) {
                const name = suite.name.replace(/^.*\/src\//, 'src/');
                const suitePassed = (suite.assertionResults || []).filter(a => a.status === 'passed').length;
                const suiteTotal = (suite.assertionResults || []).length;
                const duration = Math.round(suite.endTime - suite.startTime) + 'ms';
                summary += `| \`${name}\` | **${suitePassed} / ${suiteTotal}** | ${duration} |\n`;
              }
            }

            // Write to GitHub Actions Step Summary (visible in Checks tab)
            await core.summary.addRaw(summary).write();

            // Post as a comment on the Pull Request
            if (context.payload.pull_request) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: summary
              });
            }

            if (failed > 0) {
              core.setFailed(`Unit test audit failed with ${failed} test failures.`);
            }
          } catch (err) {
            core.setFailed("Error processing test audit results: " + err.message);
          }

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Multi-Resolution Visual Regression
      run: |
        npx playwright test tests/e2e/visual-regression.spec.ts --reporter=json --output=public/playwright-results.json
      continue-on-error: true

    - name: Publish Visual Regression Summary
      uses: actions/github-script@v2
      with:
        script: |
          const fs = require('fs');
          let summary = "### 🖼️ Multi-Resolution Visual Regression Audit\n\n";
          summary += "Comparing **375px (Mobile)** vs **1440px (Desktop)** viewports.\n\n";
          try {
            if (!fs.existsSync('public/playwright-results.json')) {
              core.setFailed("Playwright results file not found.");
              return;
            }
            const results = JSON.parse(fs.readFileSync('public/playwright-results.json', 'utf8'));
            const suites = results.suites || [];
            let total = 0, passed = 0, failed = 0;
            const rows = [];
            const walk = (suite, prefix) => {
              const name = prefix ? `${prefix} › ${suite.title}` : suite.title;
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  total++;
                  const outcome = test.results && test.results[0] && test.results[0].status;
                  if (outcome === 'passed') passed++;
                  else failed++;
                  rows.push(`| \`${name} › ${spec.title}\` | ${outcome === 'passed' ? '✅ Pass' : '❌ ' + outcome} |`);
                }
              }
              for (const child of suite.suites || []) walk(child, name);
            };
            for (const s of suites) walk(s, '');

            summary += `| Metric | Count | Status |\n`;
            summary += `| :--- | :---: | :---: |\n`;
            summary += `| **Total Visual Checks** | **${total}** | ${failed === 0 ? '✅ All Passed' : '❌ Diffs Detected'} |\n`;
            summary += `| **Passed** | ${passed} | ✅ |\n`;
            summary += `| **Failed / Diffed** | ${failed} | ${failed > 0 ? '❌' : '0'} |\n\n`;
            if (rows.length) {
              summary += `#### 📋 Viewport Comparison Breakdown\n`;
              summary += `| Test | Result |\n`;
              summary += `| :--- | :---: |\n`;
              summary += rows.join('\n') + '\n\n';
            }
            summary += `> 📎 Diff artifacts (if any) are uploaded as the \`visual-regression-diffs\` workflow artifact.\n`;

            await core.summary.addRaw(summary).write();
            if (context.payload.pull_request) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: summary
              });
            }
            if (failed > 0) {
              core.setFailed(`Visual regression audit detected ${failed} diff(s).`);
            }
          } catch (err) {
            core.setFailed("Error processing visual regression results: " + err.message);
          }

    - name: Upload Visual Regression Diffs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-regression-diffs
        path: |
          tests/e2e/__screenshots__/
          test-results/
        if-no-files-found: ignore
        retention-days: 14

    - name: Run Type Check & Build
      run: npm run build
