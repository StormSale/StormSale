name: Frontend CI & Test Audit

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "main", "dev" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Run Unit Tests & Coverage Audit Export
      run: |
        npx vitest run --coverage --reporter=default --reporter=json --outputFile=test-results.json
      continue-on-error: true

    - name: Publish Test Audit & Enforced Coverage Summary
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const { evaluateDiffCoverage, generateMarkdownReport, loadLcov, parseAddedLinesFromPatch, isCoverageRelevant } = require(path.resolve('scripts/check-coverage.cjs'));

          let summary = "### 🧪 Unit Test Execution Audit\n\n";
          try {
            if (!fs.existsSync('test-results.json')) {
              core.setFailed("Test results file not found.");
              return;
            }
            const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
            const passed = results.numPassedTests || 0;
            const total = results.numTotalTests || 0;
            const failed = results.numFailedTests || 0;
            const suites = results.numTotalTestSuites || 0;

            summary += `| Metric | Count | Status |\n`;
            summary += `| :--- | :---: | :---: |\n`;
            summary += `| **Total Tests Carried Out** | **${total}** | ${failed === 0 ? '✅ All Passed' : '❌ Failures Detected'} |\n`;
            summary += `| **Passed Tests** | ${passed} | ✅ |\n`;
            summary += `| **Failed Tests** | ${failed} | ${failed > 0 ? '❌' : '0'} |\n`;
            summary += `| **Test Suites** | ${suites} | 📁 |\n\n`;

            if (results.testResults && results.testResults.length > 0) {
              summary += `#### 📋 Suite Breakdown\n`;
              summary += `| Test Suite | Tests Passed | Duration |\n`;
              summary += `| :--- | :---: | :---: |\n`;
              for (const suite of results.testResults) {
                const name = suite.name.replace(/^.*\/src\//, 'src/');
                const suitePassed = (suite.assertionResults || []).filter(a => a.status === 'passed').length;
                const suiteTotal = (suite.assertionResults || []).length;
                const duration = Math.round(suite.endTime - suite.startTime) + 'ms';
                summary += `| \`${name}\` | **${suitePassed} / ${suiteTotal}** | ${duration} |\n`;
              }
              summary += `\n`;
            }

            // Coverage Evaluation & File-by-File Metrics
            let coverageFailed = false;
            if (fs.existsSync('coverage/lcov.info')) {
              const lcovMap = loadLcov('coverage/lcov.info');

              let targets = [];
              if (context.payload.pull_request) {
                try {
                  const { data: prFiles } = await github.rest.pulls.listFiles({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.payload.pull_request.number,
                    per_page: 100,
                  });
                  targets = prFiles
                    .filter((f) => isCoverageRelevant(f.filename))
                    .map((f) => ({ file: f.filename, addedLines: parseAddedLinesFromPatch(f.patch) }));
                } catch (e) {
                  core.setFailed("Could not list PR files for diff coverage: " + e.message);
                  return;
                }
              } else {
                // Push to a protected branch: derive changed lines from git.
                const { execSync } = require('child_process');
                try {
                  const base = context.payload.repository.default_branch || 'dev';
                  execSync(`git fetch --no-tags origin ${base}`, { stdio: 'ignore' });
                  const { computeChangedTargetsFromGit } = require(path.resolve('scripts/check-coverage.cjs'));
                  targets = computeChangedTargetsFromGit(`origin/${base}`);
                } catch (e) {
                  console.log("Could not compute changed files via git: " + e.message);
                }
              }

              const evaluation = evaluateDiffCoverage(lcovMap, targets, {
                threshold: 80,
              });

              try {
                if (fs.existsSync('coverage/coverage-summary.json')) {
                  evaluation.total = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
                }
              } catch (e) {
                console.log("Could not read coverage summary: " + e.message);
              }

              const coverageMd = generateMarkdownReport(evaluation);
              summary += `\n---\n\n` + coverageMd;

              if (evaluation.violations.length > 0) {
                coverageFailed = true;
              }
            } else {
              summary += `\n> [!WARNING]\n> LCOV coverage report not found. Ensure Vitest ran with --coverage.\n`;
            }

            // Write to GitHub Actions Step Summary (visible in Checks tab)
            await core.summary.addRaw(summary).write();

            if (failed > 0) {
              core.setFailed(`Unit test audit failed with ${failed} test failures.`);
            }

            if (coverageFailed) {
              core.setFailed(`Coverage threshold check failed: PR added lines dropped below 80% coverage.`);
            }
          } catch (err) {
            core.setFailed("Error processing test audit results: " + err.message);
          }

    - name: Run Type Check & Build
      run: npm run build

  e2e-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium firefox webkit

    - name: Run E2E Smoke Tests
      run: npm run test:e2e

    - name: Upload Playwright Report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 7

