name: Secret & Key Leak Scan

on:
  push:
    branches: [ "main", "dev" ]
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Scan specifically for Stellar Secret Keys (RFC 4648 S...)
        run: |
          echo "Scanning diff for leaked Stellar secret seed keys (S...)..."
          # Stellar secret seeds start with S and are 56 uppercase Base32 characters
          LEAKS=$(git grep -EI "S[ABCD][A-Z2-7]{54}" -- ':!package-lock.json' ':!*.test.ts' ':!*.test.tsx' || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::Found potential Stellar Secret Key in repository code:"
            echo "$LEAKS"
            exit 1
          fi
          echo "No Stellar secret keys detected."

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks Secret Detection
        run: |
          gitleaks detect --source=. --no-git --redact --verbose

