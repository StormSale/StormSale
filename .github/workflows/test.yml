name: Automated Test Suite

on:
  pull_request:
    branches: ["dev", "main"]
  push:
    branches: ["dev", "main"]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR / branch
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest shard
        run: npx vitest run --shard=${{ matrix.shard }}/3 --reporter=default --reporter=junit --outputFile=vitest-junit-${{ matrix.shard }}.xml

      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-report-shard-${{ matrix.shard }}
          path: vitest-junit-${{ matrix.shard }}.xml
          retention-days: 7

  e2e:
    name: E2E tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The Playwright webServer serves the production build via `vite preview`.
      - name: Build Application
        run: npm run build

      # Chromium only: cross-browser coverage (firefox, webkit) lives in e2e.yml.
      - name: Run Playwright shard
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/2

      # Videos, traces and screenshots are only kept for failing tests
      # (see `use` in playwright.config.ts), so this only uploads on failure.
      - name: Upload failing E2E videos & traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failures-shard-${{ matrix.shard }}
          path: |
            test-results/e2e/
            playwright-report/
          retention-days: 14

  tests-passed:
    name: All tests passed
    if: ${{ always() }}
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "unit=${{ needs.unit.result }} e2e=${{ needs.e2e.result }}"
          if [ "${{ needs.unit.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            exit 1
          fi
